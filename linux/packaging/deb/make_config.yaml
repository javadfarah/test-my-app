display_name: Spotify
package_name: spotify
maintainer:
  name: spotify
  email: linux@spotify.com

priority: optional
section: x11
installed_size: 6604
essential: false
icon: assets/images/source/ic_launcher_border.png

# Post-installation tasks:
# 1. Inject StartupWMClass into the system .desktop file for correct icon association
# 2. Remove conflicting spotify.desktop files from users' .local directories (cleanup AppImage artifacts)
# 3. Update the desktop database to apply changes immediately
postinstall_scripts:
  - echo "Setting up Spotify..."
  - sudo sed -i '/^\[Desktop Entry\]/a StartupWMClass=app.spotify.com' "/usr/share/applications/spotify.desktop"
  - echo "Search and remove spotify.desktop from .local"
  - for user_dir in /home/*; do if [ -f "$user_dir/.local/share/applications/spotify.desktop" ]; then rm -f "$user_dir/.local/share/applications/spotify.desktop"; echo "Found and removed spotify.desktop from $user_dir .local"; fi; done
  - update-desktop-database /usr/share/applications
  - echo "Spotify is ready to use :)"

# Post-uninstallation tasks:
# 1. Iterate through all user directories to remove Spotify configuration and data
# 2. Clean up root user data to ensure a clean removal
postuninstall_scripts:
  - echo "Removing Spotify user data..."
  - for user_dir in /home/*; do if [ -d "$user_dir/.local/share/spotify" ]; then rm -rf "$user_dir/.local/share/spotify"; echo "Removed data from $user_dir"; fi; done
  - rm -rf /root/.local/share/spotify
  - echo "Spotify data cleanup complete."

